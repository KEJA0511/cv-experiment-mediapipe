[project]
name = "cv-experiment"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kejia Cao", email = "kcao0888@uni.sydney.edu.au" }
]
requires-python = ">=3.10,<3.11"
dependencies = [
    "matplotlib>=3.7,<3.11",
    "mediapipe>=1.0.1",
    "numpy>=1.24,<2",
    "opencv-python>=4.8,<5",
    "scikit-learn>=1.3,<1.7",
]

[project.scripts]
cv-experiment = "cv_experiment:main"
cv-train = "cv_experiment.training:main"
cv-render-skeleton = "cv_experiment.render_skeleton:main"
cv-env-check = "cv_experiment.env_check:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
